name: Check site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate data, HTML and local assets
        run: python scripts/check_site.py

      - name: Check Python syntax
        run: python -m py_compile scripts/fetch_bgm.py scripts/check_site.py

      - name: Check JavaScript syntax
        run: node --check app.js && node --check content.js
