<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 迷路的档案</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c7000a'/%3E%3Ctext x='32' y='45' font-family='Arial Black,Arial' font-size='38' font-weight='900' text-anchor='middle' fill='%23fbf8f1'%3EK%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Mochiy+Pop+One&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbf8f1;
    --ink: #1c1a17;
    --muted: #6f6659;
    --red: #c7000a;
    --red-deep: #7d0000;
    --yellow: #ffd451;
    --cyan: #16b8d6;
    --pink: #f0b9ac;
    --line: #d8cebc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 28px;
    background:
      radial-gradient(120% 90% at 50% 0%, #fffdf8 0%, var(--paper) 45%, #f6f0e4 100%);
    color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(28, 26, 23, .16) 1px, transparent 1.2px);
    background-size: 7px 7px;
    opacity: .42;
  }
  .nf {
    position: relative;
    z-index: 2;
    width: min(760px, 100%);
    padding: 48px 24px;
    text-align: center;
  }
  .nf-stamp {
    width: 98px;
    height: 98px;
    margin: 0 auto 24px;
    display: grid;
    place-items: center;
    background: var(--red);
    color: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    font-family: "Inter", sans-serif;
    font-weight: 900;
    font-size: 30px;
    line-height: 1;
    transform: rotate(-5deg);
    text-shadow: 2px 2px 0 var(--red-deep);
  }
  .nf-kicker {
    margin: 0 0 12px;
    font-family: "Inter", sans-serif;
    font-weight: 800;
    font-size: 9px;
    letter-spacing: .24em;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-family: "Inter", sans-serif;
    font-weight: 900;
    font-size: clamp(2.4rem, 8vw, 5.4rem);
    line-height: .95;
    letter-spacing: -.04em;
    color: var(--red);
    text-shadow: 4px 4px 0 var(--red-deep);
  }
  .nf-jp {
    margin: 10px 0 0;
    font-family: "Mochiy Pop One", "Hiragino Sans", sans-serif;
    font-size: 11px;
    letter-spacing: .06em;
    color: var(--red);
  }
  .nf-copy {
    max-width: 32em;
    margin: 26px auto 30px;
    font-size: 13px;
    line-height: 2;
    color: var(--muted);
  }
  .nf-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }
  .nf-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 13px 22px;
    border: 2px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    font-family: "Inter", sans-serif;
    font-weight: 800;
    font-size: 10px;
    letter-spacing: .1em;
    text-decoration: none;
    transition: transform .18s, box-shadow .18s, background .18s, color .18s;
  }
  .nf-btn:hover { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .nf-btn-red { background: var(--red); color: var(--paper); }
  .nf-btn-red:hover { background: var(--red-deep); }
  .nf-foot {
    margin-top: 44px;
    font-family: "Inter", sans-serif;
    font-size: 8px;
    letter-spacing: .14em;
    color: var(--muted);
  }
  .confetti i {
    position: fixed;
    display: block;
    border-radius: 999px;
    pointer-events: none;
    z-index: 1;
  }
  .confetti i:nth-child(1) { left: 6%; top: 18%; width: 54px; height: 14px; background: var(--cyan); transform: rotate(-28deg); }
  .confetti i:nth-child(2) { right: 7%; top: 24%; width: 34px; height: 10px; background: var(--pink); transform: rotate(22deg); }
  .confetti i:nth-child(3) { left: 12%; bottom: 16%; width: 42px; height: 12px; background: var(--yellow); transform: rotate(14deg); }
  .confetti i:nth-child(4) { right: 12%; bottom: 12%; width: 24px; height: 8px; background: var(--cyan); transform: rotate(-34deg); }
  @media (max-width: 520px) {
    body { padding: 18px; }
    .nf { padding: 20px 8px; }
    .nf-copy { font-size: 12px; }
    .confetti i:nth-child(1), .confetti i:nth-child(2) { opacity: .55; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<div class="confetti" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<main class="nf">
  <div class="nf-stamp" aria-hidden="true">404</div>
  <p class="nf-kicker">ARCHIVE NOT FOUND / 迷路的档案</p>
  <h1>LOST IN<br>ARCHIVE</h1>
  <p class="nf-jp" lang="ja">このページは、ここにはない。</p>
  <p class="nf-copy">
    你要找的条目不在这一层。<br>
    可能是链接写错了，也可能是它已经被移到了别处。
  </p>
  <div class="nf-actions">
    <a class="nf-btn nf-btn-red" href="index.html"><span>回到档案馆</span><b aria-hidden="true">↗</b></a>
    <a class="nf-btn" href="https://bgm.tv/user/m1n" target="_blank" rel="noopener noreferrer">去 BANGUMI</a>
  </div>
  <p class="nf-foot">KOKO / ACGN ARCHIVE — ERROR 404</p>
</main>
</body>
</html>
